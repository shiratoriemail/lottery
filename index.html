<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EPDW創業記念 抽選会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@400;700&family=Chivo+Mono:wght@500;700&display=swap">
<style>
/* Layout: one stage screen — header bar, tier rail, big draw stage, winners log below. Single dark "stage" look by choice. */
:root{
  --bg:#12101c; --panel:#1d1a2c; --line:#35304d; --fg:#f3efe6; --muted:#a39db8;
  --gold:#f2c14e; --red:#e4573d; --silver:#c9cbd6; --bronze:#d08a52; --teal:#46c2b0;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --num:"Chivo Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
/* gorgeous title */
.topbar{display:flex;justify-content:flex-end;gap:8px}
.title{position:relative;text-align:center;padding-block:8px 18px;display:grid;gap:6px;justify-items:center;overflow:hidden}
.title .eyebrow{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:800;font-size:clamp(1.1rem,3.6vw,1.9rem);letter-spacing:.3em;color:var(--gold);
  display:flex;align-items:center;gap:.8em;padding-left:.3em}
.title .eyebrow::before,.title .eyebrow::after{content:"";width:clamp(24px,8vw,90px);height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
.title .eyebrow::after{transform:scaleX(-1)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(3.2rem,15vw,8rem);line-height:1.05;margin:0;letter-spacing:.12em;padding-left:.12em;
  background:linear-gradient(100deg,#b8862b 0%,#ffe9a8 22%,#f2c14e 40%,#fff6d6 50%,#d9a33a 62%,#ffe08a 80%,#b8862b 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;
  filter:drop-shadow(0 4px 0 #6b4a12) drop-shadow(0 0 24px rgba(242,193,78,.35))}
@keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
.title .rule{font-size:.85rem;letter-spacing:.4em;color:var(--muted);padding-left:.4em}
#sparkles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.title>:not(canvas){position:relative}
.btn{font:700 1rem var(--body);border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:10px 16px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-family:var(--display);font-weight:400;font-size:1.3rem;padding:14px 28px;letter-spacing:.06em}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.small{font-size:.85rem;padding:6px 12px}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}

/* settings */
#setup{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px}
#setup h2{margin:0;font-size:1.1rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
input{font:500 1rem var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=number]{font-family:var(--num)}
.prizeRow{display:grid;grid-template-columns:4.5rem 1fr 6rem;gap:8px;align-items:center}
.prizeRow b{font-family:var(--display);font-weight:400}
.note{font-size:.85rem;color:var(--muted);margin:0}
.err{color:var(--red);font-weight:700}

/* tier rail */
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tier{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);display:grid;gap:2px;min-width:0}
.tier .t{font-family:var(--display);font-size:1.1rem}
.tier .p{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tier.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.tier.done{opacity:.55}
.tier.done .t::after{content:" 済";font-size:.75rem;color:var(--teal)}

/* stage */
#stage{border-radius:18px;padding:24px 20px;display:grid;gap:18px;justify-items:center;text-align:center;
  background:radial-gradient(ellipse at 50% 0%,#2d2546 0%,var(--panel) 70%);border:1px solid var(--line);min-height:320px}
.rank{font-family:var(--display);font-size:clamp(2.4rem,9vw,5rem);line-height:1;letter-spacing:.06em}
.prize{font-family:var(--display);font-size:clamp(1.2rem,4vw,2rem);color:var(--gold);min-height:1.4em;opacity:0;transform:scale(.8);transition:opacity .5s,transform .5s cubic-bezier(.2,1.6,.4,1)}
.prize.show{opacity:1;transform:none}
.sub{color:var(--muted);margin:0}
.balls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
.ball{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;font-size:var(--bs,2rem);
  min-width:calc(var(--bs,2rem)*2.6);padding:.25em .4em;border-radius:12px;background:var(--bg);border:2px solid var(--line);color:var(--muted)}
.ball.win{color:var(--bg);background:var(--c,var(--gold));border-color:var(--c,var(--gold));animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.4)}to{transform:none}}
.tier1{--c:var(--gold)}.tier2{--c:var(--silver)}.tier3{--c:var(--bronze)}.tier4{--c:var(--teal)}
.rank.tier1{color:var(--gold)}.rank.tier2{color:var(--silver)}.rank.tier3{color:var(--bronze)}.rank.tier4{color:var(--teal)}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}

/* log */
#log{display:grid;gap:10px}
#log h2{margin:0;font-size:1.1rem}
.logRow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;gap:6px}
.logRow .h{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.logRow .h b{font-family:var(--display);font-weight:400}
.logRow .nums{font-family:var(--num);font-variant-numeric:tabular-nums;word-break:break-word;color:var(--fg)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
@media (max-width:560px){.rail{grid-template-columns:repeat(2,1fr)}.prizeRow{grid-template-columns:3.5rem 1fr 4.5rem}}
/* prize reveal */
.reveal{display:grid;gap:12px;justify-items:center;width:100%}
.prizeImg{width:min(520px,100%);aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:3px solid var(--c,var(--gold));
  box-shadow:0 0 0 6px rgba(242,193,78,.15),0 18px 40px rgba(0,0,0,.5);background:var(--bg);animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;max-width:100%}
.mystery{width:min(520px,100%);aspect-ratio:4/3;border-radius:16px;border:3px dashed var(--line);display:grid;place-items:center;
  font-family:var(--display);font-size:clamp(3rem,12vw,6rem);color:var(--line);max-width:100%}
.imgCell{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.fileBtn{position:relative;overflow:hidden}
.fileBtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.prizeBlock{display:grid;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
/* 1等 suspense on stage */
#stage.suspense{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 2px var(--gold),0 0 20px rgba(242,193,78,.2)}to{box-shadow:0 0 0 2px var(--gold),0 0 70px rgba(242,193,78,.65)}}
#stage.suspense .ball:not(.win){border-color:var(--gold);color:var(--fg)}

/* 1等 grand reveal overlay */
#grand{position:fixed;inset:0;z-index:50;overflow:auto;background:radial-gradient(circle at 50% 38%,#4a3409 0%,#1a1103 55%,#050300 100%);color:#fff7e0;
  padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 24px)}
#grand .rays{position:fixed;left:50%;top:38%;width:240vmax;height:240vmax;transform:translate(-50%,-50%);pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,110,.2) 0deg 6deg,transparent 6deg 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 0%,transparent 45%);mask-image:radial-gradient(circle,#000 0%,transparent 45%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#grand::after{content:"";position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
#grand.go::after{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.grandInner{position:relative;z-index:1;min-height:100%;max-width:960px;margin:0 auto;display:grid;align-content:center;justify-items:center;gap:clamp(10px,2vh,20px);text-align:center}
.g-eyebrow{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:800;letter-spacing:.3em;padding-left:.3em;color:#f2c14e;font-size:clamp(1rem,3vw,1.5rem)}
.g-rank{font-family:var(--display);font-size:clamp(6rem,30vw,15rem);line-height:.95;letter-spacing:.06em;padding-left:.06em;
  background:linear-gradient(100deg,#b8862b 0%,#ffe9a8 22%,#f2c14e 40%,#fff6d6 50%,#d9a33a 62%,#ffe08a 80%,#b8862b 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #6b4a12) drop-shadow(0 0 40px rgba(255,200,80,.6))}
.g-title{font-family:var(--display);font-size:clamp(1.6rem,6vw,3.2rem);letter-spacing:.3em;padding-left:.3em;color:#fff7e0;text-shadow:0 0 18px rgba(255,200,80,.9)}
.g-nums{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,3vw,24px)}
.g-num{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(3rem,15vw,7.5rem);line-height:1;padding:.12em .3em;border-radius:16px;color:#2a1a00;
  background:linear-gradient(160deg,#fff4c2,#f2c14e 45%,#b8862b);box-shadow:0 0 0 3px #fff3c4,0 0 44px rgba(255,200,80,.75)}
.g-img{width:min(440px,100%);max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:4px solid #f2c14e;box-shadow:0 0 50px rgba(255,200,80,.5)}
.g-prize{font-family:var(--display);font-size:clamp(1.6rem,6vw,3rem);color:#ffe08a;text-wrap:balance}
#grandClose{margin-top:8px;background:rgba(0,0,0,.45);border-color:#f2c14e;color:#ffe08a}
#grand.go .g-eyebrow{animation:fadeUp .6s .2s both}
#grand.go .g-rank{animation:slam .9s cubic-bezier(.2,1.4,.4,1) both,shine 5s linear .9s infinite}
#grand.go .g-title{animation:fadeUp .6s .6s both}
#grand.go .g-num{animation:popBig .7s cubic-bezier(.2,1.6,.4,1) both}
#grand.go #gImg{animation:fadeUp .8s 1.7s both}
#grand.go .g-prize{animation:fadeUp .8s 2s both}
#grand.go #grandClose{animation:fadeUp .6s 2.6s both}
@keyframes slam{0%{transform:scale(3);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes popBig{0%{transform:scale(.2) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ball.win,.prizeImg{animation:none}.prize{transition:none}h1{animation:none}
  #stage.suspense,#grand .rays,#grand.go *,#grand.go::after{animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button class="btn small" id="soundBtn" type="button">🔊 音あり</button>
    <button class="btn small" id="setupBtn" type="button">設定</button>
  </div>
  <header class="title">
    <canvas id="sparkles" aria-hidden="true"></canvas>
    <div class="eyebrow">EPDW 創業記念</div>
    <h1>抽選会</h1>
    <div class="rule">GRAND PRIZE DRAW</div>
  </header>

  <section id="setup">
    <h2>抽選の設定</h2>
    <div class="grid2">
      <label for="maxNum">配った番号札の最大番号（1〜この番号で抽選）
        <input id="maxNum" type="number" min="1" value="80" inputmode="numeric">
      </label>
      <label for="exclude">欠席・対象外の番号（カンマ区切り、例：3,17,25）
        <input id="exclude" type="text" placeholder="なし">
      </label>
    </div>
    <div style="display:grid;gap:8px">
      <div class="prizeRow note"><span>等級</span><span>景品名（当選まで非表示）</span><span>当選人数</span></div>
      <div id="prizeRows"></div>
      <p class="note">景品の写真は「写真を選ぶ」から登録できます（この端末に保存）。GitHubに prize1.jpg〜prize4.jpg を置いても自動で表示されます。</p>
    </div>
    <p class="note" id="setupMsg">受付が終わってから最大番号を入れてください。同じ番号が2回当たることはありません。</p>
    <div class="controls" style="justify-content:flex-start">
      <button class="btn primary" id="startBtn" type="button">この設定で開始</button>
    </div>
  </section>

  <section id="main" hidden>
    <div class="rail" id="rail"></div>
  </section>

  <section id="stage" hidden>
    <div class="rank" id="rank">4等</div>
    <div class="reveal" id="reveal"></div>
    <div class="prize" id="prize"></div>
    <p class="sub" id="sub"></p>
    <div class="balls" id="balls"></div>
    <div class="controls">
      <button class="btn primary" id="drawBtn" type="button">ルーレット スタート</button>
      <button class="btn" id="nextBtn" type="button" hidden>次の等級へ</button>
      <button class="btn" id="replayBtn" type="button" hidden>1等の発表をもう一度</button>
    </div>
  </section>

  <section id="log" hidden>
    <div class="foot">
      <h2>当選番号一覧</h2>
      <button class="btn small" id="resetBtn" type="button">最初からやり直す</button>
    </div>
    <div id="logRows"></div>
  </section>
</div>

<div id="grand" hidden role="dialog" aria-modal="true" aria-label="1等 当選発表">
  <div class="rays"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="grandInner">
    <div class="g-eyebrow">EPDW 創業記念 抽選会</div>
    <div class="g-rank">1等</div>
    <div class="g-title">大当たり</div>
    <div class="g-nums" id="gNums"></div>
    <div id="gImg"></div>
    <div class="g-prize" id="gPrize"></div>
    <button class="btn" id="grandClose" type="button">閉じる</button>
  </div>
</div>

<script>
const DEFAULT_PRIZES=[
  {rank:1,name:"1等の景品名",count:2},
  {rank:2,name:"2等の景品名",count:5},
  {rank:3,name:"3等の景品名",count:15},
  {rank:4,name:"4等の景品名",count:20},
];
const KEY="lottery-roulette-v1";
let S={prizes:JSON.parse(JSON.stringify(DEFAULT_PRIZES)),max:80,exclude:"",started:false,results:{},order:[4,3,2,1],idx:0};
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.prizes)S=v;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=id=>document.getElementById(id);
const IMGKEY=r=>"lottery-img-"+r;
function getImg(r){try{return localStorage.getItem(IMGKEY(r))||""}catch(e){return ""}}
function setImg(r,d){try{d?localStorage.setItem(IMGKEY(r),d):localStorage.removeItem(IMGKEY(r));return true}catch(e){return false}}
function imgSrc(r){return getImg(r)||`prize${r}.jpg`}
function resizeFile(file){return new Promise((ok,ng)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  const m=1000,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.82))};im.onerror=ng;im.src=fr.result};fr.onerror=ng;fr.readAsDataURL(file)})}

/* ---------- setup ---------- */
function renderSetup(){
  $("maxNum").value=S.max;$("exclude").value=S.exclude;
  $("prizeRows").innerHTML=S.prizes.map(p=>{const im=getImg(p.rank);return `
    <div class="prizeBlock">
      <div class="prizeRow">
        <b class="rank tier${p.rank}" style="font-size:1.2rem">${p.rank}等</b>
        <input id="pn${p.rank}" type="text" value="${esc(p.name)}" aria-label="${p.rank}等の景品名">
        <input id="pc${p.rank}" type="number" min="1" value="${p.count}" inputmode="numeric" aria-label="${p.rank}等の人数">
      </div>
      <div class="imgCell">
        ${im?`<img class="thumb" src="${im}" alt="">`:`<span class="note">写真なし</span>`}
        <label class="btn small fileBtn" for="pf${p.rank}">写真を選ぶ<input id="pf${p.rank}" type="file" accept="image/*" data-r="${p.rank}"></label>
        ${im?`<button class="btn small" type="button" data-del="${p.rank}">写真を外す</button>`:""}
      </div>
    </div>`}).join("");
  $("prizeRows").querySelectorAll("input[type=file]").forEach(inp=>inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;keepNames();
    try{const d=await resizeFile(f);if(!setImg(+inp.dataset.r,d)){msg("写真を保存できませんでした。容量オーバーの可能性があります。小さめの写真でお試しください。");return}}
    catch(e){msg("この写真は読み込めませんでした。JPEGかPNGの画像を選んでください。");return}
    renderSetup();});
  $("prizeRows").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{keepNames();setImg(+b.dataset.del,"");renderSetup();});
}
function keepNames(){S.prizes.forEach(p=>{const n=$("pn"+p.rank),c=$("pc"+p.rank);if(n)p.name=n.value;if(c)p.count=parseInt(c.value,10)||p.count;});S.max=parseInt($("maxNum").value,10)||S.max;S.exclude=$("exclude").value;save();}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function parseExclude(t){return new Set(String(t).split(/[,、\s]+/).map(x=>parseInt(x,10)).filter(n=>!isNaN(n)))}
function pool(){
  const ex=parseExclude(S.exclude),won=new Set(Object.values(S.results).flat());
  const a=[];for(let i=1;i<=S.max;i++)if(!ex.has(i)&&!won.has(i))a.push(i);return a;
}
$("startBtn").onclick=()=>{
  const max=parseInt($("maxNum").value,10);
  S.prizes.forEach(p=>{p.name=$("pn"+p.rank).value.trim()||`${p.rank}等`;p.count=Math.max(1,parseInt($("pc"+p.rank).value,10)||1);});
  S.exclude=$("exclude").value;
  if(!(max>=1)){msg("最大番号を1以上で入れてください。");return;}
  S.max=max;
  const total=S.prizes.reduce((a,p)=>a+p.count,0);
  const avail=pool().length;
  if(total>avail){msg(`当選人数の合計（${total}名）が抽選対象（${avail}名）より多いです。人数か最大番号を見直してください。`);return;}
  S.started=true;save();showMain();$("setupBtn").textContent="設定";window.scrollTo({top:0,behavior:"smooth"});
};
function msg(t){$("setupMsg").innerHTML=`<span class="err">${t}</span>`}

/* ---------- main ---------- */
function prizeOf(r){return S.prizes.find(p=>p.rank===r)}
function showMain(){
  $("setup").hidden=true;$("main").hidden=false;$("stage").hidden=false;$("log").hidden=false;
  renderRail();renderLog();prepareStage();
}
function renderRail(){
  const cur=S.order[S.idx];
  $("rail").innerHTML=S.order.map(r=>{const p=prizeOf(r);
    return `<div class="tier ${r===cur?"now":""} ${S.results[r]?"done":""}"><span class="t rank tier${r}" style="font-size:1.1rem">${r}等</span><span class="p">${S.results[r]?esc(p.name):"？？？"}・${p.count}名</span></div>`}).join("");
}
function prepareStage(){
  const r=S.order[S.idx];
  if(r===undefined){ // finished
    $("rank").className="rank tier1";$("rank").textContent="抽選終了";
    $("prize").className="prize show";$("prize").textContent="ご参加ありがとうございました";
    $("sub").textContent="";$("balls").innerHTML="";$("reveal").innerHTML="";$("drawBtn").hidden=true;$("nextBtn").hidden=true;$("replayBtn").hidden=!S.results[1];return;
  }
  const p=prizeOf(r);
  $("rank").className="rank tier"+r;$("rank").textContent=r+"等";
  $("prize").className="prize";$("prize").textContent="";
  $("reveal").innerHTML=`<div class="mystery" aria-label="景品は当選発表で公開">？</div>`;
  $("sub").textContent=`${p.count}名を一度に抽選します（残り対象 ${pool().length}名）`;
  const size=p.count<=2?"clamp(3rem,14vw,6rem)":p.count<=5?"clamp(2.2rem,9vw,4rem)":p.count<=15?"clamp(1.4rem,5vw,2.4rem)":"clamp(1.2rem,4vw,2rem)";
  $("balls").style.setProperty("--bs",size);
  $("balls").innerHTML=Array.from({length:p.count},()=>`<div class="ball">${"-".repeat(String(S.max).length)}</div>`).join("");
  $("drawBtn").hidden=false;$("drawBtn").disabled=false;$("nextBtn").hidden=true;$("replayBtn").hidden=true;
  if(S.results[r]){showWinners(r,false);}
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

let spinning=false;
$("drawBtn").onclick=()=>{
  if(spinning)return;const r=S.order[S.idx];const p=prizeOf(r);
  const cand=pool();if(cand.length<p.count){$("sub").textContent="抽選対象が足りません。";return;}
  const winners=shuffle(cand.slice()).slice(0,p.count).sort((a,b)=>a-b);
  spinning=true;$("drawBtn").disabled=true;
  const balls=[...$("balls").children];const pad=String(S.max).length;
  const dur=r===1?16000:r===2?8000:4500; const t0=performance.now();
  // 1等(2名): 1人目は中盤で確定、2人目は最後まで引っぱる
  const stopAt=(r===1&&balls.length===2)?[dur*0.5,dur]:balls.map((_,i)=>dur*0.55+dur*0.45*((i+1)/balls.length));
  Music.start(r,dur/1000);
  if(r===1){$("stage").classList.add("suspense");$("sub").textContent="運命の1等、抽選中…";}
  let last=0,stopped=0;
  function frame(t){
    const el=t-t0;
    let interval;
    if(r===1){ // 止まる直前ほどゆっくり
      const next=stopAt.find(x=>x>el)??dur, prev=stopAt.filter(x=>x<=el).pop()||0;
      const k=Math.min(1,(el-prev)/Math.max(1,next-prev));
      interval=50+Math.pow(k,3)*480;
    }else interval=60+Math.min(el/dur,1)*120;
    if(t-last>interval){last=t;
      balls.forEach((b,i)=>{if(el<stopAt[i]){b.textContent=String(cand[Math.floor(Math.random()*cand.length)]).padStart(pad,"0");}});
    }
    balls.forEach((b,i)=>{if(el>=stopAt[i]&&!b.classList.contains("win")){b.textContent=String(winners[i]).padStart(pad,"0");b.classList.add("win","tier"+r);stopped++;Music.ding(r);
      if(r===1&&stopped<balls.length)$("sub").textContent=`残り${balls.length-stopped}名…！`;}});
    if(el<dur)requestAnimationFrame(frame);else finish();
  }
  function finish(){
    Music.stop();Music.fanfare(r);
    S.results[r]=winners;save();
    if(r===1){
      $("sub").textContent="1等 決定！";
      setTimeout(()=>{$("stage").classList.remove("suspense");spinning=false;showWinners(r,true);renderRail();renderLog();Grand.show(r,winners);},1650);
    }else{spinning=false;showWinners(r,true);renderRail();renderLog();}
  }
  requestAnimationFrame(frame);
};
$("replayBtn").onclick=()=>{if(S.results[1]){Music.fanfare(1);setTimeout(()=>Grand.show(1,S.results[1]),1650);}};
function showWinners(r,anim){
  const pad=String(S.max).length;const balls=[...$("balls").children];
  S.results[r].forEach((n,i)=>{if(balls[i]){balls[i].textContent=String(n).padStart(pad,"0");balls[i].classList.add("win","tier"+r);if(!anim)balls[i].style.animation="none";}});
  const p=prizeOf(r);
  $("prize").textContent=p.name;$("prize").classList.add("show");
  const src=imgSrc(r);
  $("reveal").innerHTML=`<img class="prizeImg tier${r}" alt="${esc(p.name)}">`;
  const im=$("reveal").querySelector("img");
  im.onerror=()=>{$("reveal").innerHTML=""};im.src=src;
  if(!anim)im.style.animation="none";
  if(anim)Sparkle.burst();
  $("sub").textContent=`当選おめでとうございます！ 番号札をお持ちの方は前へどうぞ`;
  $("drawBtn").hidden=true;$("nextBtn").hidden=false;$("replayBtn").hidden=r!==1;
  $("nextBtn").textContent=S.idx<S.order.length-1?`次へ（${S.order[S.idx+1]}等）`:"抽選を終える";
}
$("nextBtn").onclick=()=>{S.idx++;save();renderRail();prepareStage();};
function renderLog(){
  const rows=S.order.filter(r=>S.results[r]).map(r=>{const p=prizeOf(r);
    return `<div class="logRow"><div class="h"><b class="rank tier${r}" style="font-size:1.1rem">${r}等</b><span>${esc(p.name)}</span><span class="note">${S.results[r].length}名</span></div><div class="nums">${S.results[r].join("、")}</div></div>`});
  $("logRows").innerHTML=rows.join("")||`<p class="note">まだ当選者はいません。4等から順に抽選します。</p>`;
}
$("setupBtn").onclick=()=>{ if(spinning)return;
  const anyDrawn=Object.keys(S.results).length>0;
  const opening=$("setup").hidden;
  if(!opening&&!S.started)return; // 開始前は設定画面を閉じない
  $("setup").hidden=!opening;
  $("setupBtn").textContent=opening&&S.started?"設定を閉じる":"設定";
  if(opening){
    renderSetup();
    $("startBtn").textContent=anyDrawn?"設定を保存して戻る":"この設定で開始";
    $("setupMsg").textContent=anyDrawn?"抽選済みの結果はそのまま残ります。景品名の修正や、遅れて来た方の分の最大番号の変更ができます。":"受付が終わってから最大番号を入れてください。同じ番号が2回当たることはありません。";
    $("setup").scrollIntoView({behavior:"smooth",block:"start"});
  }
};
let resetArmed=null;
$("resetBtn").onclick=()=>{
  if(spinning)return;
  const b=$("resetBtn");
  if(!resetArmed){
    b.textContent="もう一度押すと結果を消します";b.classList.add("danger");
    resetArmed=setTimeout(()=>{resetArmed=null;b.textContent="最初からやり直す";b.classList.remove("danger");},4000);
    return;
  }
  clearTimeout(resetArmed);resetArmed=null;b.textContent="最初からやり直す";b.classList.remove("danger");
  Music.stop();Grand.hide();$("stage").classList.remove("suspense");
  S.results={};S.idx=0;S.started=false;save();
  $("main").hidden=true;$("stage").hidden=true;$("log").hidden=true;$("setup").hidden=false;
  $("balls").innerHTML="";$("startBtn").textContent="この設定で開始";
  $("setupMsg").textContent="結果を消しました。設定を確認して開始してください。";
  renderSetup();window.scrollTo({top:0,behavior:"smooth"});
};

/* ---------- sound (Web Audio, no files) ---------- */
const Music=(()=>{
  let ctx,on=true,loop=null,master,bus=null;
  function ac(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.4;
    const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);}
    if(ctx.state==="suspended")ctx.resume();return ctx}
  function note(f,t,d,type="square",v=.15,dst){const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dst||master);o.start(t);o.stop(t+d+.02)}
  function noise(t,d,v=.12,freq=5000,ftype="highpass",dst){const c=ac(),b=c.createBuffer(1,Math.max(1,c.sampleRate*d|0),c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;
    const s=c.createBufferSource(),g=c.createGain(),h=c.createBiquadFilter();h.type=ftype;h.frequency.value=freq;s.buffer=b;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(h);h.connect(g);g.connect(dst||master);s.start(t)}
  function brass(fs,t,d,v=.05,dst){const c=ac(),vv=v/Math.sqrt(fs.length);fs.forEach(f=>[-7,0,7].forEach(det=>{const o=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();
    o.type="sawtooth";o.frequency.value=f;o.detune.value=det;lp.type="lowpass";lp.frequency.setValueAtTime(700,t);lp.frequency.linearRampToValueAtTime(3400,t+.07);lp.frequency.exponentialRampToValueAtTime(1500,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vv,t+.035);g.gain.setValueAtTime(vv,t+d*.75);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(lp);lp.connect(g);g.connect(dst||master);o.start(t);o.stop(t+d+.05)}))}
  function timp(f,t,v=.6,dst){const c=ac(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(f*1.4,t);o.frequency.exponentialRampToValueAtTime(f,t+.08);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+1.3);o.connect(g);g.connect(dst||master);o.start(t);o.stop(t+1.4);noise(t,.15,v*.3,400,"lowpass",dst)}
  function crash(t,v=.3,d=3,dst){noise(t,d,v,3000,"highpass",dst)}
  function pad(fs,t,d,v=.02,dst){const c=ac();fs.forEach(f=>[-9,9].forEach(det=>{const o=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();
    o.type="sawtooth";o.frequency.value=f;o.detune.value=det;lp.type="lowpass";lp.frequency.value=1500;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.4);g.gain.setValueAtTime(v,t+Math.max(.5,d-.2));g.gain.exponentialRampToValueAtTime(.0001,t+d+.25);
    o.connect(lp);lp.connect(g);g.connect(dst||master);o.start(t);o.stop(t+d+.3)}))}
  function newBus(){const c=ac();bus=c.createGain();bus.gain.value=1;bus.connect(master);return bus}

  // 3等・4等・2等: 軽快なゲームショー風ループ
  const bass=[110,110,147,147,131,131,165,165], arp=[440,554,659,880,659,554,494,587,740,587,523,659,784,659,587,494];
  function startLoop(r){const c=ac(),b=newBus();const step=60/(r===2?132:150)/2;let n=0,next=c.currentTime+.05;
    loop=setInterval(()=>{while(next<c.currentTime+.2){
      if(n%2===0)note(bass[(n/2|0)%8],next,step*1.8,"triangle",.3,b);
      note(arp[n%16],next,step*.8,"square",.06,b);
      noise(next,.04,n%4===2?.15:.06,5000,"highpass",b);
      if(r===2&&n%8===0)timp(110,next,.35,b);
      n++;next+=step;}},50);}

  // 1等: ドラムロール＋ティンパニ＋盛り上がる弦（だんだん大きく、速く）
  function grandRoll(sec){const c=ac(),b=newBus(),t0=c.currentTime+.05;
    b.gain.setValueAtTime(.5,t0);b.gain.linearRampToValueAtTime(1.15,t0+sec);
    for(let t=0;t<sec;t+=.055)noise(t0+t,.05,.04+.08*(t/sec),1800,"highpass",b);
    let t=0;while(t<sec){timp(Math.floor(t)%2?55:73.4,t0+t,.5,b);t+=Math.max(.3,1-.7*(t/sec));}
    const prog=[[220,261.6,329.6,440],[174.6,220,261.6,349.2],[196,246.9,293.7,392],[164.8,207.7,246.9,329.6]];
    const len=2;let i=0;for(let s=0;s<sec-.2;s+=len,i++){const lift=i>=4?2:1;pad(prog[i%4].map(f=>f*(i>=4&&i%4!==3?1:1)),t0+s,Math.min(len,sec-s),.018*lift,b);}
    // 最後の数秒で上昇するうなり
    const o=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain(),ts=t0+Math.max(0,sec-5);
    o.type="sawtooth";o.frequency.setValueAtTime(110,ts);o.frequency.exponentialRampToValueAtTime(880,t0+sec);lp.type="lowpass";lp.frequency.value=2000;
    g.gain.setValueAtTime(.0001,ts);g.gain.exponentialRampToValueAtTime(.05,t0+sec);o.connect(lp);lp.connect(g);g.connect(b);o.start(ts);o.stop(t0+sec+.1);
  }
  function grandFanfare(){const c=ac(),t=c.currentTime+.05;
    [[0,[329.6,659.3],.11],[.13,[329.6,659.3],.11],[.26,[329.6,659.3],.11],[.4,[220,277.2,329.6,440],.55],
     [1.0,[246.9,329.6,415.3,493.9],.3],[1.33,[277.2,370,440,554.4],.3],[1.7,[110,220,277.2,329.6,440,554.4,659.3],3.4]]
     .forEach(([d,fs,l])=>brass(fs,t+d,l,.06));
    timp(110,t+.4,.7);for(let i=0;i<8;i++)timp(110,t+1.02+i*.08,.2+i*.05);timp(55,t+1.7,1);crash(t+1.7,.4,3.8);
    [880,1108.7,1318.5,1760,2217.5,2637].forEach((f,i)=>note(f,t+1.8+i*.07,1.3,"sine",.09));
    [[3.4,[220,277.2,329.6,440,554.4]],[3.75,[246.9,329.6,415.3,493.9]],[4.1,[220,277.2,329.6,440,554.4,659.3,880]]]
      .forEach(([d,fs],k)=>brass(fs,t+d,k===2?3:.3,.05));
    timp(55,t+4.1,.9);crash(t+4.1,.3,3.5);
    [1318.5,1760,2217.5,2637,3520].forEach((f,i)=>note(f,t+4.2+i*.06,1.2,"sine",.06));
  }
  return{
    start(r,sec){if(!on)return;try{r===1?grandRoll(sec):startLoop(r)}catch(e){}},
    stop(){clearInterval(loop);loop=null;if(bus&&ctx){const b=bus,n=ctx.currentTime;b.gain.cancelScheduledValues(n);b.gain.setValueAtTime(b.gain.value,n);b.gain.linearRampToValueAtTime(0,n+.12);setTimeout(()=>{try{b.disconnect()}catch(e){}},400);}bus=null},
    ding(r){if(!on)return;try{const t=ac().currentTime;
      if(r===1){timp(55,t,1);crash(t,.35,2.5);brass([220,277.2,329.6,440],t,.6,.05);}
      else{note(1318,t,.25,"sine",.25);note(1976,t+.03,.3,"sine",.12)}}catch(e){}},
    fanfare(r){if(!on)return;try{if(r===1){grandFanfare();return}const t=ac().currentTime+.05;
      const seq=r===2?[[523,0,.15],[523,.16,.15],[523,.32,.15],[698,.5,.9],[880,.5,.9],[1046,.5,.9]]:[[659,0,.12],[784,.13,.12],[1046,.26,.6]];
      seq.forEach(([f,d,l])=>note(f,t+d,l,"sawtooth",.12));if(r===2)crash(t+.5,.2,1.5);}catch(e){}},
    toggle(){on=!on;if(!on)this.stop();return on},
    unlock(){try{ac()}catch(e){}}
  };
})();
$("soundBtn").onclick=()=>{const on=Music.toggle();$("soundBtn").textContent=on?"🔊 音あり":"🔇 音なし";if(on)Music.unlock();};
document.addEventListener("pointerdown",()=>Music.unlock(),{once:true});

/* ---------- sparkles behind the title ---------- */
const Sparkle=(()=>{
  const cv=$("sparkles"),cx=cv.getContext("2d");let W,H,pts=[],extra=0;
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){const r=cv.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
  function mk(){return{x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1,p:Math.random()*6.28,v:Math.random()*.03+.01}}
  function star(x,y,s,a){cx.globalAlpha=a;cx.fillStyle="#ffe7a0";cx.beginPath();cx.moveTo(x,y-s*3);cx.lineTo(x+s*.7,y-s*.7);cx.lineTo(x+s*3,y);cx.lineTo(x+s*.7,y+s*.7);cx.lineTo(x,y+s*3);cx.lineTo(x-s*.7,y+s*.7);cx.lineTo(x-s*3,y);cx.lineTo(x-s*.7,y-s*.7);cx.fill()}
  function loop(){cx.clearRect(0,0,W,H);const n=26+Math.round(extra);while(pts.length<n)pts.push(mk());if(pts.length>n)pts.length=n;
    pts.forEach(q=>{q.p+=q.v*(extra?3:1);const a=Math.max(0,Math.sin(q.p));if(a<.02&&Math.random()<.05)Object.assign(q,mk());star(q.x,q.y,q.s,a*.9)});
    if(extra>0)extra=Math.max(0,extra-.3);if(!still)requestAnimationFrame(loop)}
  addEventListener("resize",size);size();loop();
  return{burst(){extra=60}};
})();

/* ---------- 1等 grand reveal ---------- */
const Grand=(()=>{
  const el=$("grand"),cv=$("confetti"),cx=cv.getContext("2d");let run=false,P=[],W=0,H=0;
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cols=["#f2c14e","#fff3c4","#e4573d","#ffffff","#d9a33a","#46c2b0"];
  function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
  function mk(){return{x:Math.random()*W,y:-20-Math.random()*H,w:6+Math.random()*8,h:10+Math.random()*10,vy:2+Math.random()*3,vx:-1+Math.random()*2,r:Math.random()*6.28,vr:-.2+Math.random()*.4,c:cols[Math.random()*cols.length|0],sw:Math.random()*6.28}}
  function loop(){if(!run)return;cx.clearRect(0,0,W,H);
    P.forEach(p=>{p.y+=p.vy;p.sw+=.05;p.x+=p.vx+Math.sin(p.sw)*.8;p.r+=p.vr;if(p.y>H+20){Object.assign(p,mk());p.y=-20;}
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.sw))+1);cx.restore()});
    requestAnimationFrame(loop)}
  function show(r,nums){const p=prizeOf(r),pad=String(S.max).length;
    $("gNums").innerHTML=nums.map((n,i)=>`<div class="g-num" style="animation-delay:${(.9+i*.4).toFixed(2)}s">${String(n).padStart(pad,"0")}</div>`).join("");
    $("gPrize").textContent=p.name;
    $("gImg").innerHTML=`<img class="g-img" alt="${esc(p.name)}">`;const im=$("gImg").querySelector("img");im.onerror=()=>{$("gImg").innerHTML=""};im.src=imgSrc(r);
    el.hidden=false;el.scrollTop=0;el.classList.remove("go");void el.offsetWidth;el.classList.add("go");
    if(!still){size();P=Array.from({length:Math.min(240,Math.round(W*H/4500))},mk);if(!run){run=true;loop()}}}
  function hide(){el.hidden=true;run=false;cx.clearRect(0,0,W,H)}
  $("grandClose").onclick=hide;
  addEventListener("keydown",e=>{if(e.key==="Escape"&&!el.hidden)hide()});
  addEventListener("resize",()=>{if(run)size()});
  return{show,hide};
})();

/* ---------- boot ---------- */
renderSetup();
if(S.started)showMain();
</script>
